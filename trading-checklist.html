</button>

<h3 id="status"></h3>

<script>
function checkReady(){

let checks=document.querySelectorAll("input[type='checkbox']");
let ready=true;

checks.forEach(function(box){
    if(!box.checked){
        ready=false;
    }
});

document.getElementById("status").textContent =
ready ? "🎉 Ready to Trade!" : "⚠️ Complete all checklist items first.";

}
</script>
